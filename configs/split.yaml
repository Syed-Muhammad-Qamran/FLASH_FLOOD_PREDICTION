# Single source of truth for the chronological split.
# Both modules and every script MUST read this file. Do not hardcode years.
#
# Rules enforced by floodwatch.splits:
#   - train ends before validation starts, validation ends before test starts
#   - `gap_days` are dropped from the START of each later split, so no rolling
#     feature window can straddle a boundary
#   - thresholds, scalers and tier cutoffs are fitted on TRAIN only
#   - the test window is evaluated exactly once (scripts/06_evaluate_test.py)

train:
  start: 2010-01-01
  end: 2021-12-31

validation:
  start: 2022-01-01
  end: 2023-12-31

test:
  start: 2024-01-01
  end: 2025-12-31

gap_days: 30
timezone: UTC
