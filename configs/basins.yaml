# Operational control points.
#
# These are river gauging / outlet control points, NOT delineated catchments.
# scripts/01_make_basins.py writes a placeholder basins.geojson (buffered points)
# so the pipeline runs. Replace it in week 1 with a HydroSHEDS / MERIT-Hydro
# delineation and keep the same basin_id values.
#
# area_km2 and elevation_mean_m are approximate and are used only by the
# synthetic demo generator and as sanity checks. Do not cite them.

basins:
