[project]
name = "floodwatch"
version = "0.1.0"
description = "Operational flash-flood early-warning prototype (cloudburst + snowmelt) for Khyber Pakhtunkhwa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
app = ["streamlit>=1.33", "pydeck>=0.9", "plotly>=5.20"]
models = ["torch>=2.2", "xgboost>=2.0", "shap>=0.45", "optuna>=3.6"]
ingest = ["xarray>=2024.1", "rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0", "earthaccess>=0.10", "cdsapi>=0.7", "earthengine-api>=0.1.380"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
