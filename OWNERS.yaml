# FloodWatch KP: single-owner file map (v2 plan §9.1 / §13.1).
#
# `scripts/check_ownership.py` fails a PR when:
#   (a) a file owned by the other person changes without the `cross-owner` label,
#   (b) a contract file changes without the `contract` label,
#   (c) a new file is reached by no pattern here.
#
# Globs support `**` (any depth) and `{a,b}` alternatives.

version: 1

owners:
  qamran:
    # Configs & data
    - configs/basins.yaml
    - configs/region.yaml
